
[project]
name = "fishy-config"
version = "0.1.0"
description = "A fishy python tool to make managing config files easier using a simple templating system."
authors = [
    { name = "squid1127", email = "120748767+squid1127@users.noreply.github.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11, <4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
fishy-config = "fishy_config.cli:app"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = "^2.13.4"
jinja2 = "^3.1"
pyyaml = "^6.0"
pathspec = "^0.12"
textual = "^8.2.5"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-cov = "^4.0"
black = "^23.0"
isort = "^5.0"
mypy = "^1.0"

[tool.poetry.scripts]
fishy-config = "fishy_config.cli:app"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
